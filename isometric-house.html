<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isometric House</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f8f8f8; overflow: hidden; height: 100vh; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf8f8f8);

    const aspect = window.innerWidth / window.innerHeight;
    const d = 3;
    const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
    camera.position.set(10, 8, 10);
    camera.lookAt(0, 1, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableZoom = true;
    controls.enablePan = false;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
    dirLight.position.set(5, 10, 5);
    scene.add(dirLight);

    const color = 0x5b8def;
    const borderColor = 0x3a6bc9;

    const houseGroup = new THREE.Group();

    // Body
    const bodyGeo = new THREE.BoxGeometry(1.6, 1.4, 1.2);
    const bodyMat = new THREE.MeshLambertMaterial({ color });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.7;
    houseGroup.add(body);

    // Roof
    const roofGeo = new THREE.ConeGeometry(1.3, 0.9, 4);
    const roofMat = new THREE.MeshLambertMaterial({ color });
    const roof = new THREE.Mesh(roofGeo, roofMat);
    roof.position.y = 1.85;
    roof.rotation.y = Math.PI / 4;
    houseGroup.add(roof);

    // Borders
    const edgesBody = new THREE.EdgesGeometry(bodyGeo);
    const edgesRoof = new THREE.EdgesGeometry(roofGeo);
    const lineMat = new THREE.LineBasicMaterial({ color: borderColor, linewidth: 2 });

    const bodyLines = new THREE.LineSegments(edgesBody, lineMat);
    bodyLines.position.y = 0.7;
    houseGroup.add(bodyLines);

    const roofLines = new THREE.LineSegments(edgesRoof, lineMat);
    roofLines.position.y = 1.85;
    roofLines.rotation.y = Math.PI / 4;
    houseGroup.add(roofLines);

    // Door (recessed plane, same color)
    const doorGeo = new THREE.PlaneGeometry(0.4, 0.7);
    const doorMat = new THREE.MeshLambertMaterial({ color: borderColor });
    const door = new THREE.Mesh(doorGeo, doorMat);
    door.position.set(0, 0.35, 0.61);
    houseGroup.add(door);

    scene.add(houseGroup);

    window.addEventListener('resize', () => {
      const aspect = window.innerWidth / window.innerHeight;
      camera.left = -d * aspect;
      camera.right = d * aspect;
      camera.top = d;
      camera.bottom = -d;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
